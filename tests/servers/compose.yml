# Throwaway servers for Dalan's real-server tests (replica/testing/test-plan.md section 11).
# Start them with scripts/test-servers.sh, which also makes the keys and writes .test-servers/servers.json.
# Never point any of this at a real machine. Every password here is a test value.
name: dalan-test

networks:
  default:
    name: dalan-test-net

x-linuxserver: &linuxserver
  image: lscr.io/linuxserver/openssh-server
  environment: &linuxserver-env
    PUID: "1000"
    PGID: "1000"

services:
  # a: password sign-in, the bastion, and the tunnel server (the script turns forwarding on).
  a:
    <<: *linuxserver
    container_name: dalan-test-ssh
    networks: { default: { aliases: [bastion] } }
    ports: ["2222:2222"]
    environment:
      <<: *linuxserver-env
      PASSWORD_ACCESS: "true"
      USER_NAME: test
      USER_PASSWORD: test

  # b: key only. Both test keys from .test-servers/ are accepted; the CA key makes certificate sign-in testable.
  b:
    <<: *linuxserver
    container_name: dalan-test-key
    networks: { default: { aliases: [keyhost] } }
    ports: ["2223:2222"]
    volumes: ["../../.test-servers:/keys:ro"]
    environment:
      <<: *linuxserver-env
      PASSWORD_ACCESS: "false"
      USER_NAME: keyuser
      PUBLIC_KEY_FILE: /keys/authorized.pub

  # c: only reachable from a, as inner:2222.
  c:
    <<: *linuxserver
    container_name: dalan-test-inner
    networks: { default: { aliases: [inner] } }
    environment:
      <<: *linuxserver-env
      PASSWORD_ACCESS: "true"
      USER_NAME: test
      USER_PASSWORD: test

  # redis: one single server for the Redis tests (replica/redis/spec.md, R1). Reachable from the other containers as
  # redis:6379 (the "through a host" route) and from this computer on 16390 (the direct route).
  # The default user needs the password; app-ro is a read-only ACL user.
  redis:
    image: redis:7
    container_name: dalan-test-redis
    networks: { default: { aliases: [redis] } }
    ports: ["16390:6379"]
    command: ["redis-server", "--requirepass", "test-redis", "--user", "app-ro", "on", ">ro-pass", "~*", "&*", "+@read", "+@connection", "+info", "+dbsize", "+select", "+config|get"]

  # SQL and MongoDB (D0 onward). Reachable from the sshd container `a` by name (the "through a host" route), and each
  # on a published port that is not the engine's usual one (a developer's own Postgres or MongoDB is often running).
  pg:
    image: postgres:16
    container_name: dalan-test-pg
    networks: { default: { aliases: [pg] } }
    ports: ["15432:5432"]
    environment: { POSTGRES_PASSWORD: test-pg, POSTGRES_USER: app, POSTGRES_DB: shop }
    # TLS with a certificate made at start: a small CA, and a server certificate it signed for the names pg and
    # localhost (a self-signed certificate that is its own CA is refused by rustls as a server certificate). The tests
    # trust ca.crt ("verify") or ignore the chain ("require").
    command:
      - sh
      - -c
      - |
        d=/var/lib/postgresql
        openssl req -new -x509 -days 3650 -nodes -subj "/CN=dalan-test-ca" -keyout $$d/ca.key -out $$d/ca.crt
        openssl req -new -nodes -subj "/CN=pg" -keyout $$d/server.key -out $$d/server.csr
        printf 'subjectAltName=DNS:pg,DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\n' > $$d/ext.cnf
        openssl x509 -req -in $$d/server.csr -CA $$d/ca.crt -CAkey $$d/ca.key -CAcreateserial -days 3650 -extfile $$d/ext.cnf -out $$d/server.crt
        chown postgres:postgres $$d/server.crt $$d/server.key
        chmod 600 $$d/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=$$d/server.crt -c ssl_key_file=$$d/server.key
  mysql:
    image: mysql:8.4
    container_name: dalan-test-mysql
    networks: { default: { aliases: [mysql] } }
    ports: ["13306:3306"]
    environment: { MYSQL_ROOT_PASSWORD: test-mysql, MYSQL_USER: app, MYSQL_PASSWORD: test-mysql, MYSQL_DATABASE: shop }
  mariadb:
    image: mariadb:11
    container_name: dalan-test-mariadb
    networks: { default: { aliases: [mariadb] } }
    ports: ["13307:3306"]
    environment: { MARIADB_ROOT_PASSWORD: test-mariadb, MARIADB_USER: app, MARIADB_PASSWORD: test-mariadb, MARIADB_DATABASE: shop }
  mongo:
    image: mongo:7
    container_name: dalan-test-mongo
    networks: { default: { aliases: [mongo] } }
    ports: ["17017:27017"]
    environment: { MONGO_INITDB_ROOT_USERNAME: app, MONGO_INITDB_ROOT_PASSWORD: test-mongo }
    # TLS is optional here (preferTLS: a client may use it or not), with a small CA and a certificate it signed for the
    # names mongo and localhost. The tests trust ca.crt ("verify") or ignore the chain ("require").
    command:
      - sh
      - -c
      - |
        d=/data/tls
        mkdir -p $$d
        openssl req -new -x509 -days 3650 -nodes -subj "/CN=dalan-test-ca" -keyout $$d/ca.key -out $$d/ca.crt
        openssl req -new -nodes -subj "/CN=mongo" -keyout $$d/server.key -out $$d/server.csr
        printf 'subjectAltName=DNS:mongo,DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\n' > $$d/ext.cnf
        openssl x509 -req -in $$d/server.csr -CA $$d/ca.crt -CAkey $$d/ca.key -CAcreateserial -days 3650 -extfile $$d/ext.cnf -out $$d/server.crt
        cat $$d/server.key $$d/server.crt > $$d/server.pem
        chown -R mongodb:mongodb $$d
        exec docker-entrypoint.sh mongod --tlsMode preferTLS --tlsCertificateKeyFile $$d/server.pem --tlsCAFile $$d/ca.crt --tlsAllowConnectionsWithoutCertificates --bind_ip_all

  # Redis Cluster (R6): three primaries and three replicas. No published ports: the nodes announce their
  # addresses on this network, so the cluster is only reachable through a host (`a`), like a production one.
  rc1: &rcnode
    image: redis:7
    container_name: dalan-test-rc1
    networks: { default: { aliases: [rc1] } }
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-node-timeout", "5000", "--requirepass", "test-redis", "--masterauth", "test-redis"]
  rc2: { <<: *rcnode, container_name: dalan-test-rc2, networks: { default: { aliases: [rc2] } } }
  rc3: { <<: *rcnode, container_name: dalan-test-rc3, networks: { default: { aliases: [rc3] } } }
  rc4: { <<: *rcnode, container_name: dalan-test-rc4, networks: { default: { aliases: [rc4] } } }
  rc5: { <<: *rcnode, container_name: dalan-test-rc5, networks: { default: { aliases: [rc5] } } }
  rc6: { <<: *rcnode, container_name: dalan-test-rc6, networks: { default: { aliases: [rc6] } } }
  # Joins the six nodes. Runs on every `up`: a healthy cluster is left alone. After Docker restarts, the containers
  # can come back with other addresses while each node still remembers the old ones (cluster_state:fail); then every
  # node is emptied and forgotten, and the cluster is made again. These are throwaway test servers: nothing is kept.
  rc-init:
    image: redis:7
    container_name: dalan-test-rc-init
    depends_on: [rc1, rc2, rc3, rc4, rc5, rc6]
    restart: "no"
    command:
      - sh
      - -c
      - |
        sleep 3
        cli() { redis-cli -a test-redis --no-auth-warning "$$@"; }
        # Healthy means EVERY node says ok, knows six nodes, and lists none as failed or without an address. (Asking
        # only rc1 once called a cluster healthy while rc2 said "fail" and rc1 still remembered its old address.)
        healthy() {
          for n in rc1 rc2 rc3 rc4 rc5 rc6; do
            cli -h $$n -p 7000 cluster info | grep -q 'cluster_state:ok' || return 1
            cli -h $$n -p 7000 cluster info | grep -q 'cluster_known_nodes:6' || return 1
            cli -h $$n -p 7000 cluster nodes | grep -qE 'fail|noaddr|handshake|disconnected' && return 1
          done
          return 0
        }
        if healthy; then echo "cluster is healthy"; exit 0; fi
        nodes=""
        for n in rc1 rc2 rc3 rc4 rc5 rc6; do
          cli -h $$n -p 7000 flushall >/dev/null 2>&1 || true
          cli -h $$n -p 7000 cluster reset hard >/dev/null 2>&1 || true
          nodes="$$nodes $$(getent hosts $$n | cut -d' ' -f1):7000"
        done
        cli --cluster create $$nodes --cluster-replicas 1 --cluster-yes
        for i in $$(seq 1 30); do healthy && exit 0; sleep 1; done
        echo "the cluster did not become healthy" >&2; exit 1

  # Redis Sentinel (R6): one primary, two replicas, three sentinels watching "mymaster". Also only on this network.
  rs-primary:
    image: redis:7
    container_name: dalan-test-rs-primary
    networks: { default: { aliases: [rs-primary] } }
    command: ["redis-server", "--requirepass", "test-redis", "--masterauth", "test-redis"]
  rs-replica1: &rsreplica
    image: redis:7
    container_name: dalan-test-rs-replica1
    networks: { default: { aliases: [rs-replica1] } }
    depends_on: [rs-primary]
    command: ["redis-server", "--replicaof", "rs-primary", "6379", "--requirepass", "test-redis", "--masterauth", "test-redis"]
  rs-replica2: { <<: *rsreplica, container_name: dalan-test-rs-replica2, networks: { default: { aliases: [rs-replica2] } } }
  rs-s1: &rssentinel
    image: redis:7
    container_name: dalan-test-rs-s1
    networks: { default: { aliases: [rs-s1] } }
    depends_on: [rs-primary]
    command:
      - sh
      - -c
      - |
        printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel monitor mymaster rs-primary 6379 2\nsentinel auth-pass mymaster test-redis\nsentinel down-after-milliseconds mymaster 3000\nsentinel failover-timeout mymaster 10000\n' > /tmp/sentinel.conf
        exec redis-server /tmp/sentinel.conf --sentinel
  rs-s2: { <<: *rssentinel, container_name: dalan-test-rs-s2, networks: { default: { aliases: [rs-s2] } } }
  rs-s3: { <<: *rssentinel, container_name: dalan-test-rs-s3, networks: { default: { aliases: [rs-s3] } } }

  # kbd: password, then "Verification code:" (a time-based code; scripts/test-servers.sh otp prints the current one).
  kbd:
    build: ./debian-sshd
    container_name: dalan-test-kbd
    networks: { default: { aliases: [kbd] } }
    ports: ["2224:22"]
    environment: { VARIANT: kbd }
    volumes: ["../../.test-servers/otp-secret:/otp/secret:ro"]

  # slow: a, behind an 800 ms delay, for the slow connect and the step log.
  slow:
    build: ./slow
    container_name: dalan-test-slow
    networks: { default: { aliases: [slow] } }
    ports: ["2225:2225"]
    cap_add: [NET_ADMIN]
    depends_on: [a]

  # oldkex: offers only an old key exchange, so the handshake fails with "couldn't agree".
  oldkex:
    build: ./debian-sshd
    container_name: dalan-test-oldkex
    networks: { default: { aliases: [oldkex] } }
    ports: ["2226:22"]
    environment: { VARIANT: oldkex }

  # rot: a plain password server whose host key the tests replace (F12), so no other test depends on it.
  rot:
    build: ./debian-sshd
    container_name: dalan-test-rot
    networks: { default: { aliases: [rot] } }
    ports: ["2228:22"]
    environment: { VARIANT: mosh }

  # twin: a second plain Debian server, so a workspace test can run on two servers that behave the same way.
  twin:
    build: ./debian-sshd
    container_name: dalan-test-twin
    networks: { default: { aliases: [twin] } }
    ports: ["2229:22"]
    environment: { VARIANT: mosh }

  # web: something to reach through a tunnel.
  web:
    image: nginx:alpine
    container_name: dalan-test-web
    networks: { default: { aliases: [web] } }
    ports: ["8088:80"]

  # squid: an HTTP CONNECT proxy that may reach SSH ports.
  squid:
    image: ubuntu/squid
    container_name: dalan-test-squid
    networks: { default: { aliases: [squid] } }
    ports: ["3128:3128"]
    volumes: ["./squid.conf:/etc/squid/squid.conf:ro"]
    command: ["squid", "-f", "/etc/squid/squid.conf", "-N", "-d", "1"]

  # socks: a SOCKS5 proxy with no sign-in.
  socks:
    image: serjs/go-socks5-proxy
    container_name: dalan-test-socks
    networks: { default: { aliases: [socks] } }
    ports: ["1080:1080"]
    environment: { REQUIRE_AUTH: "false" }

  # telnet: a plain shell with no sign-in, to see the plaintext warning and the Telnet session.
  telnet:
    image: busybox:stable
    container_name: dalan-test-telnet
    networks: { default: { aliases: [telnet] } }
    ports: ["2323:23"]
    command: ["telnetd", "-F", "-l", "/bin/sh"]

  # mosh: needs the mosh client on this computer too; started only with `scripts/test-servers.sh up --extra`.
  mosh:
    build: ./debian-sshd
    container_name: dalan-test-mosh
    profiles: [extra]
    networks: { default: { aliases: [mosh] } }
    ports: ["2227:22", "60001-60010:60001-60010/udp"]
    environment: { VARIANT: mosh }
