<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Dalan">
  <!-- Dalan's mark: a pointed Persian arch (iwan) seen head-on, with a lit opening that reads as a
       terminal cursor. Master for the app icon: macOS grid (824 px squircle on a 1024 px canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b22"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="512" cy="700" r="360">
      <stop offset="0" stop-color="#3cc8c0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3cc8c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <g transform="translate(96 109) scale(26)">
    <path d="M8 27V15c0-5 4-9 8-11 4 2 8 6 8 11v12" fill="none" stroke="#3cc8c0" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="14" y="18" width="4" height="7" fill="#66d6cf"/>
  </g>
</svg>
