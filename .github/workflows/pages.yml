# Publishes site/ (the download page) with GitHub Pages. The page's REPO and VERSION are filled in
# here from this repository and its newest release, so nobody edits them by hand.
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set repository and version in the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName 2>/dev/null || true)
          version=${tag#v}
          sed -i "s#OWNER/dalan-app#${GITHUB_REPOSITORY}#" site/index.html
          if [ -n "$version" ]; then sed -i "s#const VERSION = '[^']*'#const VERSION = '${version}'#" site/index.html; fi
          grep -n "const REPO\|const VERSION" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
