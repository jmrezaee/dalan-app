name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Brand sweep and contrast
        run: |
          python3 replica/sweep.py . --config replica/brand.json
          python3 replica/design/contrast.py replica/design/tokens.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the SPA first: tauri::generate_context! needs frontendDist to exist.
      - run: pnpm build
      - name: The production build has no test hooks
        run: pnpm check:hooks
      - name: Clean room: the built app carries nothing of the original
        run: python3 replica/sweep.py .output/public --config replica/brand.json
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Bindings are up to date
        run: git diff --exit-code app/types/bindings.ts

  # The app in a real browser with a fake Rust backend (tests/e2e): unlock, the connection overlay (F01, F11, F12),
  # tabs, shortcuts and the import preview.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (specs, fake backend contract, accessibility)
        run: pnpm test:e2e
      - name: Every flow and screen has a test
        run: pnpm coverage --check
      - name: The walkthrough (every chapter, headless)
        run: pnpm walk:ci
      - name: Clean room: the walkthrough captions and results
        run: python3 replica/sweep.py walk-results --config replica/brand.json
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            playwright-report
            walk-report
          retention-days: 7

  # The tests that talk to real servers (L3): shell, jump host, key install, SFTP, tunnels, two-step sign-in, old key
  # exchange, a rotated host key, proxies, Telnet and a slow link. The containers come from tests/servers/compose.yml
  # through `scripts/test-servers.sh up` (a service container can't set the user and password).
  rust-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries Tauri needs to compile on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - name: Start the test servers
        run: scripts/test-servers.sh up
      - name: What is running
        run: scripts/test-servers.sh status
      - name: Build the SPA (tauri::generate_context! needs frontendDist)
        run: |
          mkdir -p .output/public && echo '<!doctype html>' > .output/public/index.html
      - name: Real-server tests
        working-directory: src-tauri
        run: cargo test -- --ignored
      - name: Server logs when a test failed
        if: failure()
        run: for c in dalan-test-kbd dalan-test-squid dalan-test-slow; do echo "== $c"; docker logs --tail 40 $c; done
      - name: Stop the test servers
        if: always()
        run: scripts/test-servers.sh down
