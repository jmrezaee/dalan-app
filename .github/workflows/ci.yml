name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Brand sweep and contrast
        run: |
          python3 replica/sweep.py . --config replica/brand.json
          python3 replica/design/contrast.py replica/design/tokens.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the SPA first: tauri::generate_context! needs frontendDist to exist.
      - run: pnpm build
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Bindings are up to date
        run: git diff --exit-code app/types/bindings.ts
