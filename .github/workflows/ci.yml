name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Brand sweep and contrast
        run: |
          python3 replica/sweep.py . --config replica/brand.json
          python3 replica/design/contrast.py replica/design/tokens.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the SPA first: tauri::generate_context! needs frontendDist to exist.
      - run: pnpm build
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Bindings are up to date
        run: git diff --exit-code app/types/bindings.ts

  # The app in a real browser with a fake Rust backend (tests/e2e): unlock, the connection overlay (F01, F11, F12),
  # tabs, shortcuts and the import preview.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          PW_CHANNEL: '' # Playwright's own Chromium instead of the Google Chrome the tests use locally
        run: pnpm test:e2e

  # The five tests that talk to a real OpenSSH server: shell, jump host, key install, SFTP, tunnels.
  # They use the same containers as `scripts/test-servers.sh` (a service container can't set the user and password).
  docker-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries Tauri needs to compile on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - name: Start the test servers
        run: scripts/test-servers.sh up
      - name: Build the SPA (tauri::generate_context! needs frontendDist)
        run: |
          mkdir -p .output/public && echo '<!doctype html>' > .output/public/index.html
      - name: Real-server tests
        working-directory: src-tauri
        run: cargo test -- --ignored
      - name: Stop the test servers
        if: always()
        run: scripts/test-servers.sh down
