# Builds installers for macOS (universal), Windows (x64) and Linux when a `v*` tag is pushed, signs
# the updates, and uploads everything to a draft GitHub Release with checksums. Setup: replica/launch/release.md.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          v=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version ${v} in src-tauri/tauri.conf.json"; exit 1
          fi
      - name: Brand sweep and contrast
        run: |
          python3 replica/sweep.py . --config replica/brand.json
          python3 replica/design/contrast.py replica/design/tokens.json
      - name: Updater key is set
        run: |
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.release.conf.json; then
            echo "::error::Put the updater public key in src-tauri/tauri.release.conf.json (see replica/launch/release.md)"; exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (see replica/launch/release.md)"; exit 1
          fi

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            args: --target universal-apple-darwin
          - platform: windows
            os: windows-latest
            args: --bundles nsis # NSIS .exe only: the .msi needs WiX, downloaded from GitHub, which often answers 5xx
          - platform: linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      # `secrets` can't be tested in a step's `if`, so the check goes through the job's env.
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # The release config turns the updater on. OWNER/dalan-app becomes this repository.
      - name: Point the updater at this repository
        shell: bash
        run: sed -i.bak "s#OWNER/dalan-app#${{ github.repository }}#" src-tauri/tauri.release.conf.json

      # Signing is optional until the Apple Developer account exists: with no secrets, the app is
      # built unsigned (right-click -> Open on first launch). Values are only exported when present.
      - name: Apple signing and notarization
        if: matrix.platform == 'macos' && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dalan ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download. Checksums are in SHA256SUMS.txt.

            **Windows:** `Dalan_<version>_x64-setup.exe` installs for you only and needs no administrator rights.
            `Dalan_<version>_x64-allusers-setup.exe` installs for everyone on the PC; it asks for administrator rights, and so does each of its updates.
            Only one of the two can be installed. Silent install options for IT: replica/launch/release-setup.md ("Silent install").
            Builds are not signed yet: Windows SmartScreen may warn (More info, then Run anyway), and macOS needs right-click, Open.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          projectPath: .
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # The second Windows edition: the same app for everyone on a PC (needs administrator rights). tauri-action uploads
  # the just-me setup above; this job builds the all-users one, renames it so the two files don't collide, uploads it
  # and writes latest-allusers.json, which the all-users build's updater reads.
  windows-allusers:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Point the updater at this repository
        run: sed -i "s#OWNER/dalan-app#${{ github.repository }}#" src-tauri/tauri.release.conf.json src-tauri/tauri.windows-allusers.conf.json
      - name: Build the all-users installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.windows-allusers.conf.json
      - name: Rename, upload and write latest-allusers.json
        run: |
          cd src-tauri/target/release/bundle/nsis
          setup=$(ls *-setup.exe)
          new="${setup/-setup.exe/-allusers-setup.exe}"
          mv "$setup" "$new" && mv "$setup.sig" "$new.sig"
          version=$(node -p "require('../../../../tauri.conf.json').version")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${new}"
          sig=$(cat "$new.sig")
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg u "$url" --arg s "$sig" \
            '{version: $v, notes: "Dalan for all users", pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}, "windows-x86_64-nsis": {signature: $s, url: $u}}}' > latest-allusers.json
          cat latest-allusers.json
          gh release upload "${GITHUB_REF_NAME}" "$new" "$new.sig" latest-allusers.json --repo "${GITHUB_REPOSITORY}" --clobber

  checksums:
    needs: [build, windows-allusers]
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
