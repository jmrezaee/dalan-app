[package]
name = "dalan-app"
version = "0.1.0"
description = "Dalan: a private SSH client"
edition = "2021"
rust-version = "1.80"

[lib]
name = "dalan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
log = "0.4.35"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2"
russh = "0.65.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1.20.0", features = ["v7"] }
zeroize = "1.8.2"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
