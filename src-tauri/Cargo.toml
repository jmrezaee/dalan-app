[package]
name = "dalan-app"
version = "0.1.2"
description = "Dalan: a private SSH client"
edition = "2021"
rust-version = "1.80"

[lib]
name = "dalan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
log = "0.4.35"
portable-pty = "0.9"
rand = { version = "0.10", features = ["thread_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2"
russh = "0.65.1"
russh-sftp = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4", default-features = false }
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
url = "2"
uuid = { version = "1.20.0", features = ["v7"] }
zeroize = "1.8.2"

# Debug builds run the password hashing (Argon2, 64 MiB) and the cipher unoptimised, which makes creating or unlocking a
# vault take minutes under `pnpm tauri dev` and in the real-app tests. These few crates are built optimised even in debug.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3

# One Dalan at a time: a second launch focuses the first window instead (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Settings > System and the installer share some registry keys (src/system_integration.rs). Windows only.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
