[package]
name = "dalan-app"
version = "0.2.0"
description = "Dalan: a private SSH client"
edition = "2021"
rust-version = "1.88"

[lib]
name = "dalan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
log = "0.4.35"
portable-pty = "0.9"
rand = { version = "0.10", features = ["thread_rng"] }
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp"] }
# D0 (replica/databases/spec.md): the SQL and MongoDB drivers. tokio-postgres takes any stream (`connect_raw`), so it is
# used as it is. mysql_async and mongodb cannot take a stream (checked in their sources), so MySQL and MariaDB are
# driven over mysql_common's packets and MongoDB over bson, on our own stream. See the D0 note in replica/progress.md.
bson = { version = "3", features = ["serde", "serde_json-1"] }
# D8: MongoDB sign-in (SCRAM-SHA-256) written on these; all were already in the tree.
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64 = "0.22"
mysql_common = { version = "0.37", default-features = false }
sqlparser = "0.64"
tokio-postgres = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
bytes = "1"
tokio-postgres-rustls = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2"
russh = "0.65.1"
russh-sftp = "3"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serialport = { version = "4", default-features = false }
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "process"] }
tokio-rustls = "0.26.6"
url = "2"
uuid = { version = "1.20.0", features = ["v7"] }
zeroize = "1.8.2"

# Debug builds run the password hashing (Argon2, 64 MiB) and the cipher unoptimised, which makes creating or unlocking a
# vault take minutes under `pnpm tauri dev` and in the real-app tests. These few crates are built optimised even in debug.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3

# One Dalan at a time: a second launch focuses the first window instead (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Settings > System and the installer share some registry keys (src/system_integration.rs). Windows only.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
